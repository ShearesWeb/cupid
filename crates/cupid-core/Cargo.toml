[package]
name = "cupid"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cupid"
path = "src/main.rs"

[dependencies]
postgres = "0.19.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
